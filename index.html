                        background: 'linear-gradient(135deg, #E75480 0%, #D946A6 100%)',

        function FaqItem({ q, a, idx, expandedFaq, setExpandedFaq }) {
            return (
                <div style={{
                    backgroundColor: 'white',
                    border: '1px solid #FFB6D9',
                    borderRadius: '12px',
                    overflow: 'hidden'
                }}>
                    <button
                        onClick={() => setExpandedFaq(expandedFaq === idx ? null : idx)}
                        style={{
                            width: '100%',
                            padding: '24px',
                            backgroundColor: expandedFaq === idx ? '#FFE8F5' : 'transparent',
                            border: 'none',
                            textAlign: 'left',
                            cursor: 'pointer',
                            display: 'flex',
                            justifyContent: 'space-between',
                            alignItems: 'center',
                            transition: 'all 0.2s'
                        }}
                    >
                        <h3 style={{ fontSize: '1.05rem', fontWeight: '900', color: '#2D2D2D', margin: 0 }}>

                    {expandedFaq === idx && (
                        <div style={{
                            padding: '0 24px 24px',
                            backgroundColor: '#FFF5FA',
                            borderTop: '1px solid #FFB6D9'
                        }}>
                            <p style={{ color: '#666', lineHeight: '1.8', margin: 0 }}>

            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LandingBisuteria />);
    </script>
