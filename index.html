<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seminario Demostrativo de Alambrismo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fffafc;
      color: #3f3540;
      line-height: 1.5;
    }

    .page {
      width: min(100%, 900px);
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    .hero {
      text-align: center;
      padding: 12px 0 24px;
    }

    .eyebrow {
      display: inline-block;
      background: #f8e7ef;
      color: #9b607b;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .5px;
      padding: 7px 13px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: clamp(25px, 6vw, 40px);
      line-height: 1.15;
      color: #392f37;
      margin-bottom: 10px;
    }

    .subtitle {
      max-width: 650px;
      margin: 0 auto;
      color: #766b73;
      font-size: 16px;
    }

    /* =========================
       CUENTA REGRESIVA
       Viernes 9 de octubre de 2026 - 6:30 p. m.
       Costa Rica (UTC-6)
       ========================= */

    // 9 oct 2026 a las 6:30 p. m. en Costa Rica = 10 oct 2026 00:30 UTC
    const classDate = Date.UTC(2026, 9, 10, 0, 30, 0);

    const accessMessage = document.getElementById("accessMessage");
    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");

    function updateCountdown() {
      const difference = classDate - Date.now();

      if (difference <= 0) {
        daysEl.textContent = "00";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";
        if (accessMessage) accessMessage.style.display = "block";
        return;
      }

      const totalSeconds = Math.floor(difference / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      daysEl.textContent = String(days).padStart(2, "0");
      hoursEl.textContent = String(hours).padStart(2, "0");
      minutesEl.textContent = String(minutes).padStart(2, "0");
      secondsEl.textContent = String(seconds).padStart(2, "0");
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);


    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");

    chatForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const message = chatInput.value.trim();

      if (!message) return;

      // Simula el envío sin mostrar mensajes anteriores
      // ni guardar conversaciones.
      chatInput.value = "";
      chatInput.placeholder = "Mensaje enviado ✓";

      setTimeout(() => {
        chatInput.placeholder = "Escribe un mensaje...";
      }, 1500);
    });
  </script>

</body>
</html>
